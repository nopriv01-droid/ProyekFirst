  <!DOCTYPE html>
  <html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Deployed</title>
    <style>
      body{
        background: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 87vh;
        font-family: sans-serif;
        padding: 40px 20px 140px 20px;
      }

      .reg-container{
        background: black, cyan;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 14px rgba(0,0,0,0.1);
        width: 350px;
      }

      h2{
        margin-top: 0;
        margin-bottom: 20px;
        color: #000;
        text-align: center;
      }

      .form-group{
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      label{
        font-weight: bold;
        font-size: 14px;
        color: #333;
        margin-bottom: 5px;
        display: flex;
        text-align: center;
      }

      input{
        width: 70%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
        outline: none;
      }

      .password-wrapper{
        position: relative;
        display: flex;
        align-items: center;
      }

      .password-wrapper input{
        padding: 40px;
      }

      .btn-regis{
        width: 30%;
        padding: 14px;
        color: white;
        background: #006AFF;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        margin-bottom: 14px;
      }

      .btn-regis:hover{
        background: #808080
      }

      .btn-login{
        width: 35%;
        padding: 10px;
        color: white;
        background: #4B524F;
        border: none;
        border-radius: 15px;
        font-size: 15px;
        margin-left: 210px;
      }

      .helper-text{
        font-size: 12px;
        color: #888;
        margin-top: 6px;
        line-height: 1.5;
      }

      .message{
        text-align: center;
        margin-bottom: 16px;
        font-size: 15px;
        font-weight: bold;
      }

      .success {color : #28a745}
    </style>
  </head>
    
  <body style="
      color: black;
    background-image: url('Back/backoff.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat:no-repeat;
">
    
  <body>

    <div class="reg-container">
      <h2>Register</h2>
      <form id="regForm" onsubmit="prosesRegister(event)">

        <div class="form-group">
          <label for="Username">
            Username
          </label>
          <input type="text" id="Username" required placeholder="Masukan User" minlength="3" maxlength="15">
          <small class="helper-text">
            Tulis User Minimal 3 Huruf!
          </small>
        </div>

        <div class="form-group">
          <label for="Password">
            Password
          </label>
          <input type="text" id="Pass"
          required placeholder="Masukan Pass">
          <small class="helper-text">
          Masukan Pass Yang Mudah Di Ingat!
        </small>
        </div>
        <button type="submit" class="btn-regis">Register</button>
      </form>
      <button onclick="window.location.href='index.html'" class="btn-login">Back Menu</button>
    
    <script>
      function prosesRegister(event) {
        event.preventDefault();
        const user = 
  document.getElementById('Username').value;
        const pass = 
  document.getElementById('Pass').value;

        if (user.trim() === "" || pass.trim() === "") {
          alert("Semua Data Harus Di Isi!")
          return;
        }

        if (localStorage.getItem(user)) {
          alert('User Tidak Tersedia Karna Sudah Di Pakai')
        } else {
          localStorage.setItem(user, pass);
          
          alert("Data Tersimpan Dalam Database Web! Kembalilah Ke Login Page!");
  document.getElementById('regForm').reset();
        }
      }
    </script>
    </body>
  </html>
