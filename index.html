<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login system Remake</title>
    <style>
        /* --- Gaya Dasar Halaman --- */
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.7s ease;
            height: 87vh;
            font-family: Arial, sans-serif;
            padding: 40px 20px 140px 20px;
        }

        /* --- Wadah Form Login --- */
        .login-container {
            background: black, gray;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease;
            width: 350px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #000;
            text-align: center;
        }

        /* --- Kelompok Input --- */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }

        /* --- Informasi Singkat di Atas Input --- */
        .input-info {
            font-size: 12px;
            color: #000;
            text-shadow: 0 0 12px rgba(255,255,255);
            margin: 0 0 8px 0;
        }

        /* --- Gaya Kolom Input --- */
        input {
            width: 75%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        /* --- Bungkus Kolom Password & Tombol Mata --- */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 40px; /* Beri ruang di kanan agar teks tidak tertutup ikon mata */
        }

        /* --- Tombol Lihat Password (Ikon Mata) --- */
        .toggle-password {
            position: absolute;
            left: 230px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .toggle-password:hover {
            color: #333;
        }

        /* --- Teks Bantuan di Bawah Input --- */
        .helper-text {
            font-size: 11px;
            color: #000;
            margin-top: 6px;
            line-height: 1.4;
        }

        /* --- Gaya Tombol Pop-up (Tooltip) --- */
        .tooltip-icon {
            display: inline-block;
            background: #f80;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 11px;
            text-align: center;
            line-height: 16px;
            cursor: help;
            position: relative;
            margin-left: 7px;
        }

        .tooltip-text {
            visibility: hidden;
            width: 220px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-weight: normal;
            font-size: 11px;
            line-height: 1.3;
        }

        .tooltip-icon:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        /* --- Tombol Login --- */
        .btn-login {
            width: 30%;
            padding: 10px;
            background: #0064fc;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-login:hover {
            background: #808080;
        }
      
      .btn-register{
            text-align: center;
            background: #4B524F;
            color: white;
            margin-left: 180px;
            padding: 8px;
            border: none;
            border-radius: 12px;
            width: 35%;
            cursor: pointer;
            font-size: 15px;
        }

        /* --- Gaya Pesan Notifikasi --- */
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
  
  <body style="
      color: black;
    background-image: url('Back/backoff.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat:no-repeat;
">
    
<body>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm" onsubmit="prosesLogin(event)">
        
        <!-- BAGIAN USERNAME DENGAN INFORMASI -->
        <div class="form-group">
            <label for="username">
                Username 
                <span class="tooltip-icon">?
                    <span class="tooltip-text">Username digunakan untuk mengenali akun Anda dan tidak bisa diubah nanti.</span>
                </span>
            </label>
            <p class="input-info">Gunakan User Dan Pass Yang Anda Registerasi!</p>
            <input type="text" id="username" required placeholder="Masukan User" minlength="3" maxlength="15">
            <small class="helper-text">
                Gunakan User Yang Anda Registerasi!
            </small>
        </div>
        <!-- BAGIAN PASSWORD DENGAN FITUR LIHAT PASSWORD -->
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" required placeholder="Masukan Pass">
                <!-- Tombol teks/emoji mata untuk interaksi -->
                <button type="button" id="togglePassword" class="toggle-password" title="Lihat Password">👁️</button>
            </div>
          <small class="helper-text">
            Gunakan Pass Yang Anda Registerasi!
          </small>
          <div id="pesan" class="message"></div>
        </div>

        <!-- TOMBOL MASUK -->
        <button type="submit" class="btn-login">Masuk</button>
    </form>
  <p class="input-info">Register for create account</p>
  <button onclick="window.location.href='register.html'" class="btn-register">Register</button>
</div>

<script>
    // --- Logika Fitur Lihat / Sembunyikan Password ---
    const passwordInput = document.getElementById('password');
    const togglePasswordButton = document.getElementById('togglePassword');

    togglePasswordButton.addEventListener('click', function () {
        // Cek tipe input saat ini
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';          // Ubah jadi teks biasa agar terlihat
            togglePasswordButton.textContent = '🙈'; // Ubah ikon jadi monyet tutup mata (sembunyikan)
            togglePasswordButton.title = 'Sembunyikan Password';
        } else {
            passwordInput.type = 'password';      // Ubah kembali jadi bintang/bulatan
            togglePasswordButton.textContent = '👁️'; // Ubah ikon kembali ke mata terbuka
            togglePasswordButton.title = 'Lihat Password';
        }
    });

function prosesLogin(event) {
  event.preventDefault();
  const user =
document.getElementById('username').value;
  const pass = 
document.getElementById('password').value;
  const savedPassword = 
localStorage.getItem(user);
  const pesanElemen = document.getElementById('pesan');

  if (!savedPassword) {
    pesanElemen.innerText = "Masukan Password Dan Username Dengan Benar";
    pesanElemen.className = "message error";
    return;
  } else if (savedPassword !== pass) {
    pesanElemen.innerText = "Password Salah Dari Database"
    pesanElemen.className = "message error";
    return;
  } else {
    pesanElemen.innerText = "Login Berhasil! Welcome!";
    pesanElemen.className = "message success";
    localStorage.setItem("userS", user);
    localStorage.setItem("passS", pass);
  }
    setTimeout(function() {
    window.location.href="dasboard.html";
    }, 2000);
}
</script>

</body>
</html>
